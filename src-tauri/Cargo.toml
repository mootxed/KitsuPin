[package]
name = "kitsupin"
version = "0.1.3"
description = "Локальная история буфера обмена для KDE X11"
authors = ["KitsuPin contributors"]
edition = "2021"
default-run = "kitsupin"

[lib]
name = "kitsupin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kitsupin"
path = "src/main.rs"

[[bin]]
name = "kitsupin-native-host"
path = "src/bin/native_host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
fs2 = "0.4"
hex = "0.4"
log = "0.4"
parking_lot = "0.12"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled-full", "chrono", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tempfile = "3"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x11rb = { version = "0.13", features = ["xfixes"] }

[dev-dependencies]

