name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Release Build & Debian Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/core-tests -> target

      - name: Install system dependencies (Ubuntu 24.04)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxfixes-dev \
            pkg-config \
            patchelf \
            build-essential \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend Lint
        run: npm run lint

      - name: Frontend Test
        run: npm test

      - name: Frontend Build
        run: npm run build

      - name: Cargo fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo clippy (main crate)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Cargo test (main crate)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo test (core tests)
        run: cargo test --manifest-path src-tauri/core-tests/Cargo.toml

      - name: Verify Version Consistency
        id: version
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          PKG_VER=$(jq -r '.version' package.json)
          TAURI_VER=$(jq -r '.version' src-tauri/tauri.conf.json)
          CARGO_VER=$(grep '^version = ' src-tauri/Cargo.toml | head -n1 | cut -d '"' -f2)
          EXT_VER=$(jq -r '.version' chrome-extension/manifest.json)

          echo "Tag version: $TAG_VER"
          echo "package.json version: $PKG_VER"
          echo "tauri.conf.json version: $TAURI_VER"
          echo "Cargo.toml version: $CARGO_VER"
          echo "chrome-extension manifest version: $EXT_VER"

          if [[ "$TAG_VER" != "$PKG_VER" || "$PKG_VER" != "$TAURI_VER" || "$PKG_VER" != "$CARGO_VER" || "$PKG_VER" != "$EXT_VER" ]]; then
            echo "::error::Версии не совпадают между тегом и манифестами проекта!"
            exit 1
          fi
          echo "version=$PKG_VER" >> "$GITHUB_OUTPUT"

      - name: Build native host binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin kitsupin-native-host

      - name: Prepare packaging files
        run: ./scripts/prepare-release-packaging.sh dev

      - name: Remove stale bundles
        run: rm -rf src-tauri/target/release/bundle

      - name: Build Tauri bundles (.deb, .rpm)
        run: npm run tauri build -- --bundles deb,rpm -c staging/tauri.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Inspect and Verify .deb package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ORIG_DEB=$(find src-tauri/target/release/bundle/deb \
            -maxdepth 1 \
            -type f \
            -name "*_${VERSION}_*.deb" \
            -print -quit)

          if [[ -z "$ORIG_DEB" ]]; then
            echo "::error::Debian package for version $VERSION was not found"
            exit 1
          fi

          FINAL_DEB="KitsuPin_${VERSION}_amd64.deb"
          cp "$ORIG_DEB" "$FINAL_DEB"

          echo "=== dpkg-deb --info ==="
          dpkg-deb --info "$FINAL_DEB"

          echo "=== dpkg-deb --contents ==="
          dpkg-deb --contents "$FINAL_DEB"

          ./scripts/verify-deb-layout.sh "$FINAL_DEB"

          sha256sum "$FINAL_DEB" > "${FINAL_DEB}.sha256"

      - name: Inspect and Verify .rpm package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ORIG_RPM=$(find src-tauri/target/release/bundle/rpm \
            -maxdepth 1 \
            -type f \
            -name "*.rpm" \
            -print -quit)

          if [[ -z "$ORIG_RPM" ]]; then
            echo "::error::RPM package for version $VERSION was not found"
            exit 1
          fi

          FINAL_RPM="KitsuPin_${VERSION}_x86_64.rpm"
          cp "$ORIG_RPM" "$FINAL_RPM"

          ./scripts/verify-rpm-layout.sh "$FINAL_RPM"

          sha256sum "$FINAL_RPM" > "${FINAL_RPM}.sha256"

      - name: Test .deb installation, upgrade cleanup, and uninstall
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FINAL_DEB="KitsuPin_${VERSION}_amd64.deb"

          if [[ ! -f "$FINAL_DEB" ]]; then
            echo "::error::Debian package file $FINAL_DEB was not found for testing"
            exit 1
          fi

          # Simulate legacy /usr/lib/KitsuPin directory to verify preinst cleanup
          sudo mkdir -p /usr/lib/KitsuPin/chrome-extension /usr/lib/KitsuPin/scripts
          sudo touch /usr/lib/KitsuPin/legacy-file.txt

          sudo dpkg -i "$FINAL_DEB"

          echo "=== Расположение бинарников ==="
          command -v kitsupin

          echo "=== Проверка прав и наличия файлов ==="
          test -x /usr/bin/kitsupin                                  && echo "OK: /usr/bin/kitsupin исполняемый"
          test -x /usr/lib/kitsupin/kitsupin-native-host            && echo "OK: /usr/lib/kitsupin/kitsupin-native-host исполняемый"
          test -f /etc/xdg/autostart/kitsupin.desktop               && echo "OK: /etc/xdg/autostart/kitsupin.desktop присутствует"
          test -d /usr/lib/kitsupin/resources/chrome-extension      && echo "OK: chrome-extension каталог присутствует"
          test -f /usr/lib/kitsupin/resources/scripts/uninstall-user-data.sh && echo "OK: uninstall-user-data.sh присутствует"

          echo "=== Проверка отсутствия /usr/lib/KitsuPin ==="
          test ! -e /usr/lib/KitsuPin && echo "OK: /usr/lib/KitsuPin отсутствует"

          echo "=== CLI smoke tests ==="
          kitsupin --version
          kitsupin --help

          echo "=== Проверка удаления (sudo apt remove) ==="
          sudo apt remove -y kitsu-pin
          test ! -e /usr/lib/kitsupin && echo "OK: /usr/lib/kitsupin удалён"
          test ! -e /usr/lib/KitsuPin && echo "OK: /usr/lib/KitsuPin не появился"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KitsuPin_${{ steps.version.outputs.version }}_amd64.deb
            KitsuPin_${{ steps.version.outputs.version }}_amd64.deb.sha256
            KitsuPin_${{ steps.version.outputs.version }}_x86_64.rpm
            KitsuPin_${{ steps.version.outputs.version }}_x86_64.rpm.sha256
          draft: false
          prerelease: true
          generate_release_notes: true
