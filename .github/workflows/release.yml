name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release:
    name: Release Build & Debian Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/core-tests -> target

      - name: Install system dependencies (Ubuntu 24.04)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxfixes-dev \
            pkg-config \
            patchelf \
            build-essential

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend Lint
        run: npm run lint

      - name: Frontend Test
        run: npm test

      - name: Frontend Build
        run: npm run build

      - name: Cargo fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Cargo clippy (main crate)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Cargo test (main crate)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo test (core tests)
        run: cargo test --manifest-path src-tauri/core-tests/Cargo.toml

      - name: Verify Version Consistency
        id: version
        run: |
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          PKG_VER=$(jq -r '.version' package.json)
          TAURI_VER=$(jq -r '.version' src-tauri/tauri.conf.json)
          CARGO_VER=$(grep '^version = ' src-tauri/Cargo.toml | head -n1 | cut -d '"' -f2)
          EXT_VER=$(jq -r '.version' chrome-extension/manifest.json)

          echo "Tag version: $TAG_VER"
          echo "package.json version: $PKG_VER"
          echo "tauri.conf.json version: $TAURI_VER"
          echo "Cargo.toml version: $CARGO_VER"
          echo "chrome-extension manifest version: $EXT_VER"

          if [[ "$TAG_VER" != "$PKG_VER" || "$PKG_VER" != "$TAURI_VER" || "$PKG_VER" != "$CARGO_VER" || "$PKG_VER" != "$EXT_VER" ]]; then
            echo "::error::Версии не совпадают между тегом и манифестами проекта!"
            exit 1
          fi
          echo "version=$PKG_VER" >> "$GITHUB_OUTPUT"

      - name: Build native host binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin kitsupin-native-host

      - name: Prepare packaging files
        run: ./scripts/prepare-release-packaging.sh dev

      - name: Build Tauri .deb bundle
        run: npm run tauri build -- --bundles deb -c staging/tauri.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Inspect and Verify .deb package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ORIG_DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n1)
          FINAL_DEB="KitsuPin_${VERSION}_amd64.deb"
          cp "$ORIG_DEB" "$FINAL_DEB"

          echo "=== dpkg-deb --info ==="
          dpkg-deb --info "$FINAL_DEB"

          echo "=== dpkg-deb --contents ==="
          dpkg-deb --contents "$FINAL_DEB"

          # Store contents once; dpkg-deb may print paths as either
          # "usr/bin/kitsupin" or "./usr/bin/kitsupin" depending on version.
          CONTENTS=$(dpkg-deb --contents "$FINAL_DEB")

          # Matches both "usr/bin/..." and "./usr/bin/..." formats.
          # Anchors the end of the path to prevent false positives
          # (e.g. kitsupin-native-host must not match kitsupin).
          require_deb_path() {
            local pattern="$1"
            local description="$2"
            if ! printf '%s\n' "$CONTENTS" | grep -Eq "$pattern"; then
              echo "::error::$description"
              exit 1
            fi
          }

          require_deb_path \
            '(^|[[:space:]])\./usr/bin/kitsupin$|(^|[[:space:]])usr/bin/kitsupin$' \
            'Основной бинарник /usr/bin/kitsupin отсутствует в пакете!'

          require_deb_path \
            '(^|[[:space:]])\./usr/lib/kitsupin/kitsupin-native-host$|(^|[[:space:]])usr/lib/kitsupin/kitsupin-native-host$' \
            'Native host /usr/lib/kitsupin/kitsupin-native-host отсутствует в пакете!'

          require_deb_path \
            '(^|[[:space:]])\./etc/xdg/autostart/kitsupin\.desktop$|(^|[[:space:]])etc/xdg/autostart/kitsupin\.desktop$' \
            'Autostart-файл /etc/xdg/autostart/kitsupin.desktop отсутствует в пакете!'

          require_deb_path \
            '(^|[[:space:]])\./usr/lib/kitsupin/resources/chrome-extension/|(^|[[:space:]])usr/lib/kitsupin/resources/chrome-extension/' \
            'Каталог Chrome-расширения /usr/lib/kitsupin/resources/chrome-extension/ отсутствует в пакете!'

          echo "Все обязательные пути найдены в пакете."
          sha256sum "$FINAL_DEB" > "${FINAL_DEB}.sha256"

      - name: Test .deb installation and binary smoke test
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FINAL_DEB="KitsuPin_${VERSION}_amd64.deb"
          sudo dpkg -i "$FINAL_DEB"

          echo "=== Расположение бинарников ==="
          command -v kitsupin
          command -v kitsupin-native-host

          echo "=== Проверка прав и наличия файлов ==="
          test -x /usr/bin/kitsupin                              && echo "OK: /usr/bin/kitsupin исполняемый"
          test -x /usr/lib/kitsupin/kitsupin-native-host        && echo "OK: /usr/lib/kitsupin/kitsupin-native-host исполняемый"
          test -f /etc/xdg/autostart/kitsupin.desktop           && echo "OK: /etc/xdg/autostart/kitsupin.desktop присутствует"
          test -d /usr/lib/kitsupin/resources/chrome-extension  && echo "OK: chrome-extension каталог присутствует"

          echo "=== CLI smoke tests ==="
          kitsupin --version
          kitsupin --help

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KitsuPin_${{ steps.version.outputs.version }}_amd64.deb
            KitsuPin_${{ steps.version.outputs.version }}_amd64.deb.sha256
          draft: false
          prerelease: true
          generate_release_notes: true
