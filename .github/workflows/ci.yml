name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-progress runs for the same branch/PR on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ── Rust core tests ────────────────────────────────────────────────────────
  rust-core:
    name: Rust core (fmt · clippy · test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            src-tauri/core-tests/target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/core-tests/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-core-

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy (core tests crate)
        run: >
          cargo clippy
          --manifest-path src-tauri/core-tests/Cargo.toml
          --all-targets
          -- -D warnings

      - name: Run core tests
        run: cargo test --manifest-path src-tauri/core-tests/Cargo.toml

  # ── Tauri system check / build (DEB) ──────────────────────────────────────
  tauri-check:
    name: Tauri DEB (check · clippy · test · build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu 24.04)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxfixes-dev \
            pkg-config \
            patchelf \
            build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tauri-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Cargo check (Tauri)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Clippy (Tauri main crate)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run main crate tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build native host binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin kitsupin-native-host

      - name: Prepare packaging files
        run: ./scripts/prepare-release-packaging.sh dev

      - name: Remove stale bundles
        run: rm -rf src-tauri/target/release/bundle

      - name: Tauri build .deb
        run: npm run tauri build -- --bundles deb -c staging/tauri.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Verify .deb package layout
        run: |
          VERSION=$(jq -r '.version' package.json)
          DEB=$(find src-tauri/target/release/bundle/deb \
            -maxdepth 1 \
            -type f \
            -name "*_${VERSION}_*.deb" \
            -print -quit)

          if [[ -z "$DEB" ]]; then
            echo "::error::Debian package for version $VERSION was not found"
            exit 1
          fi

          ./scripts/verify-deb-layout.sh "$DEB"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitsupin-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 14

  # ── Tauri RPM build ───────────────────────────────────────────────────────
  tauri-rpm-build:
    name: Tauri RPM (build · verify)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu 24.04 + rpm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxfixes-dev \
            pkg-config \
            patchelf \
            build-essential \
            rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-rpm-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tauri-rpm-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build native host binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin kitsupin-native-host

      - name: Prepare packaging files
        run: ./scripts/prepare-release-packaging.sh dev

      - name: Remove stale bundles
        run: rm -rf src-tauri/target/release/bundle

      - name: Tauri build .rpm
        run: npm run tauri build -- --bundles rpm -c staging/tauri.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Verify .rpm package layout
        run: |
          VERSION=$(jq -r '.version' package.json)
          RPM=$(find src-tauri/target/release/bundle/rpm \
            -maxdepth 1 \
            -type f \
            -name "*.rpm" \
            -print -quit)

          if [[ -z "$RPM" ]]; then
            echo "::error::RPM package for version $VERSION was not found"
            exit 1
          fi

          ./scripts/verify-rpm-layout.sh "$RPM"

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitsupin-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 14

